<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARI Plano de Vacinação</title>
<style>
/* Layout: painel do médico à esquerda, folha do utente (papel A4) à direita; empilha em ecrãs estreitos. */
:root{
  --bg:#eef3f3; --panel:#ffffff; --ink:#1f2d33; --muted:#5b6c72;
  --teal:#2f6f73; --teal-soft:#d9e8e6; --line:#c6d3d4; --warn:#a4481f; --warn-soft:#f8e6dc;
  --display:"Century Schoolbook","Century Schoolbook L","TeX Gyre Schola","New Century Schoolbook",Georgia,serif;
  --body:Calibri,Carlito,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141e22; --panel:#1c292e; --ink:#e3ecec; --muted:#9fb1b5;
    --teal:#74bab7; --teal-soft:#24403f; --line:#35494e; --warn:#f0a27c; --warn-soft:#44291c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141e22; --panel:#1c292e; --ink:#e3ecec; --muted:#9fb1b5;
  --teal:#74bab7; --teal-soft:#24403f; --line:#35494e; --warn:#f0a27c; --warn-soft:#44291c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:22px;color:var(--teal)}
.top p{margin:0;color:var(--muted);font-size:14px;flex:1 1 320px}
.langsw{display:flex;border:1px solid var(--teal);border-radius:4px;overflow:hidden}
.langsw button{border:0;border-radius:0;background:transparent;color:var(--teal);padding:5px 12px;font-size:14px}
.langsw button[aria-pressed="true"]{background:var(--teal);color:var(--panel)}
.frame{margin:0;padding:10px 20px;background:var(--teal-soft);border-bottom:1px solid var(--line);font-size:14px}
.frame[hidden]{display:none}
.wrap{display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:20px;padding:20px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);flex:none;margin-top:3px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:15px;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--teal-soft);border-color:var(--teal);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--teal);outline-offset:2px}
details{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
details>summary{cursor:pointer;font-weight:700}
details .inner{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk small{display:block;color:var(--muted)}
.group{font-family:var(--display);font-size:14px;color:var(--teal);margin-top:10px}
.vac{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.vac>label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:700}
.vac .opts{display:none;flex-wrap:wrap;gap:8px;padding-left:25px}
.vac.on .opts{display:flex}
.vac.off>label{opacity:.5;cursor:not-allowed}
.hint{flex:1 1 100%;font-size:13px;color:var(--muted);margin:0}
.tag{font-size:12px;font-weight:700;border-radius:3px;padding:1px 6px;background:var(--teal-soft);color:var(--ink);margin-left:6px;white-space:nowrap}
.tag.viva{background:var(--warn-soft);color:var(--warn)}
.alert{background:var(--warn-soft);color:var(--warn);border-left:4px solid var(--warn);padding:8px 10px;border-radius:3px;font-size:14px;margin-bottom:6px}
.info{background:var(--teal-soft);border-left:4px solid var(--teal);padding:8px 10px;border-radius:3px;font-size:14px;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
button{font:inherit;font-weight:700;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--teal);background:var(--teal);color:var(--panel)}
button.sec{background:transparent;color:var(--teal)}
button[hidden]{display:none}
.btns .field{flex:0 1 200px}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.out{display:flex;flex-direction:column;gap:16px;min-width:0}
.paperbox{overflow-x:auto}
pre{white-space:pre-wrap;font-family:var(--body);font-size:15px;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px}
.foot{font-size:13px;color:var(--muted);margin:0}

/* Folha do utente: sempre papel branco, por ser para imprimir */
.sheet{background:#fff;color:#1b2529;width:100%;max-width:794px;min-width:560px;margin:0 auto;padding:36px 40px;border:1px solid #c6d3d4;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:Calibri,Carlito,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet h1{font-family:"Century Schoolbook","Century Schoolbook L","TeX Gyre Schola",Georgia,serif;font-size:26px;color:#2f6f73;margin:0 0 4px}
.sheet h2{font-family:"Century Schoolbook","Century Schoolbook L","TeX Gyre Schola",Georgia,serif;font-size:17px;color:#2f6f73;margin:16px 0 4px}
.sheet .sub{color:#4d5e64;margin:0 0 14px}
.sheet .id{display:flex;gap:24px;flex-wrap:wrap;border-top:2px solid #2f6f73;border-bottom:1px solid #c6d3d4;padding:8px 0;margin-bottom:14px}
.sheet .id span{flex:1 1 200px}
.sheet .blank{display:inline-block;border-bottom:1px solid #1b2529;min-width:240px;height:1em;vertical-align:baseline}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.sheet th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#2f6f73;border-bottom:2px solid #2f6f73;padding:5px 8px}
.sheet td{vertical-align:top;border-bottom:1px solid #c6d3d4;padding:7px 8px}
.sheet tbody.g{border-top:2px solid #9fb8b9}
.sheet tbody.g.alt td{background:#eef4f4}
.sheet td.vn{width:27%;border-right:1px solid #c6d3d4}
.sheet td.vn b{font-size:16px}
.sheet td small{display:block;color:#4d5e64;font-size:13px}
.sheet td.ds{white-space:nowrap}
.sheet .done{white-space:nowrap;width:118px}
.sheet .box{display:inline-block;width:14px;height:14px;border:1.5px solid #1b2529;vertical-align:-2px;margin-right:6px;background:#fff}
.sheet .note{border-left:4px solid #2f6f73;background:#eaf2f1;padding:8px 12px;margin:0 0 10px}
.sheet .note.warn{border-color:#a4481f;background:#f8e6dc}
.sheet ul{margin:6px 0 0;padding-left:20px}
.sheet .tl{list-style:none;padding:0;margin:6px 0 14px;border-left:3px solid #2f6f73}
.sheet .tl li{padding:4px 0 4px 12px;position:relative}
.sheet .tl li::before{content:"";position:absolute;left:-7px;top:11px;width:11px;height:11px;border-radius:50%;background:#2f6f73}
.sheet .tl b{display:inline-block;min-width:215px}
.sheet .end{margin-top:18px;border-top:1px solid #c6d3d4;padding-top:8px;font-size:13px;color:#4d5e64}
.sheet .empty{color:#4d5e64;font-style:italic}
@page{size:A4;margin:16mm}
@media print{
  html,body{background:#fff}
  .top,.frame,.panel{display:none !important}
  .wrap{display:block;padding:0}
  .paperbox{overflow:visible}
  .sheet{border:0;box-shadow:none;max-width:none;min-width:0;padding:0;margin:0}
  .sheet tbody.g,.sheet .note,.sheet .tl li{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1 data-i="hTitle"></h1>
  <p data-ih="hSub"></p>
  <div class="langsw" role="group" aria-label="Língua / Language">
    <button type="button" id="uiPT" aria-pressed="true" lang="pt">PT</button>
    <button type="button" id="uiEN" aria-pressed="false" lang="en">EN</button>
  </div>
</header>
<p class="frame" id="frame" data-ih="frame" hidden></p>

<main class="wrap">
  <section class="panel" id="painel">
    <h2 data-i="hConsulta"></h2>
    <div class="row">
      <label class="field" for="dConsulta"><span data-i="lConsulta"></span><input type="date" id="dConsulta"></label>
      <label class="field" for="nome"><span data-i="lNome"></span><input type="text" id="nome" autocomplete="off"></label>
    </div>
    <div class="row">
      <label class="field" for="cond"><span data-i="lCond"></span><select id="cond"></select></label>
      <label class="field" for="condDet"><span data-i="lCondDet"></span><input type="text" id="condDet" autocomplete="off"></label>
    </div>
    <div class="seg" role="radiogroup" id="segSit">
      <label><input type="radio" name="sit" id="sitCand" value="cand" checked><span data-i="sitCand"></span></label>
      <label><input type="radio" name="sit" id="sitSob" value="sob"><span data-i="sitSob"></span></label>
    </div>
    <div class="row">
      <label class="field" for="dInicio"><span data-i="lInicio"></span><input type="date" id="dInicio"></label>
      <label class="field" for="dVac"><span data-i="lDvac"></span><input type="date" id="dVac"></label>
    </div>
    <details id="detFarm">
      <summary id="sumFarm"></summary>
      <div class="inner" id="listaFarm"></div>
      <p class="foot" data-i="farmFoot"></p>
    </details>
    <div id="avisos"></div>

    <h2 data-i="hVac"></h2>
    <div id="lista"></div>
    <p class="foot" data-i="vacFoot"></p>

    <h2 data-i="hOutras"></h2>
    <details id="detTB">
      <summary data-i="sumTB"></summary>
      <div class="inner">
        <label class="chk" for="tbOn"><input type="checkbox" id="tbOn" data-s="tb" data-k="on"><span data-i="incl"></span></label>
        <div class="row">
          <label class="field" for="tbReg"><span data-i="lReg"></span><select id="tbReg" data-s="tb" data-k="reg"></select></label>
          <label class="field" for="tbIni"><span data-i="lIni"></span><input type="date" id="tbIni" data-s="tb" data-k="ini"></label>
        </div>
        <div class="row">
          <label class="field" for="tbA1"><span data-i="lA1"></span><input type="date" id="tbA1" data-s="tb" data-k="a1"></label>
          <label class="field" for="tbA2"><span data-i="lA2"></span><input type="date" id="tbA2" data-s="tb" data-k="a2"></label>
          <label class="field" for="tbA3"><span data-i="lA3"></span><input type="date" id="tbA3" data-s="tb" data-k="a3"></label>
        </div>
        <p class="foot" id="tbFim"></p>
      </div>
    </details>
    <details id="detPJ">
      <summary data-i="sumPJ"></summary>
      <div class="inner">
        <label class="chk" for="pjOn"><input type="checkbox" id="pjOn" data-s="pj" data-k="on"><span data-i="incl"></span></label>
        <div class="row">
          <label class="field" for="pjF"><span data-i="lFarmaco"></span><select id="pjF" data-s="pj" data-k="f"></select></label>
          <label class="field" for="pjIni"><span data-i="lIni"></span><input type="date" id="pjIni" data-s="pj" data-k="ini"></label>
        </div>
        <label class="field" for="pjFim"><span data-i="lPjFim"></span><input type="text" id="pjFim" data-s="pj" data-k="fim" autocomplete="off"></label>
        <p class="foot" data-i="pjFoot"></p>
      </div>
    </details>
    <details id="detSS">
      <summary data-i="sumSS"></summary>
      <div class="inner">
        <label class="chk" for="ssOn"><input type="checkbox" id="ssOn" data-s="ss" data-k="on"><span data-i="incl"></span></label>
        <div class="row">
          <label class="field" for="ssModo"><span data-i="lSsModo"></span><select id="ssModo" data-s="ss" data-k="modo"></select></label>
          <label class="field" for="ssIni"><span data-i="lSsIni"></span><input type="date" id="ssIni" data-s="ss" data-k="ini"></label>
        </div>
        <p class="foot" data-i="ssFoot"></p>
      </div>
    </details>

    <h2 data-i="hNotas"></h2>
    <label class="field" for="notas"><span data-i="lNotas"></span><textarea id="notas"></textarea></label>
  </section>

  <section class="out">
    <div class="panel">
      <div class="btns">
        <label class="field" for="folhaLang"><span data-i="lFolhaLang"></span><select id="folhaLang"><option value="pt">Português</option><option value="en">English</option></select></label>
        <button id="btnImprimir" hidden data-i="bImprimir"></button>
        <button id="btnFolha" hidden data-i="bFolha"></button>
        <button id="btnCopiaFolha" class="sec" data-i="bCopiaFolha"></button>
        <button id="btnCopiaCarta" class="sec" data-i="bCopiaCarta"></button>
        <button id="btnCopiaReg" class="sec" data-i="bCopiaReg"></button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="paperbox"><div id="folha"></div></div>
    <div class="panel">
      <h2 data-i="hCarta"></h2>
      <pre id="carta" lang="pt"></pre>
    </div>
    <div class="panel">
      <h2 data-i="hReg"></h2>
      <pre id="registo" lang="pt"></pre>
      <p class="foot" data-i="footFontes"></p>
      <p class="foot" data-i="footAut"></p>
    </div>
  </section>
</main>

/* ---------- Língua ---------- */
function tx(o,k,lg){ return (lg==="en" && o[k+"_en"]!=null) ? o[k+"_en"] : o[k]; }
function u(k){ return UI[k][st.ui==="en"?1:0]; }
function doseTxt(n,lg){ return lg==="en" ? (DOSE_EN[n]||n) : n; }

/* ---------- Datas ---------- */
function parse(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function soma(d,[un,n]){ const r=new Date(d.getTime()); if(un==="d"){ r.setDate(r.getDate()+n); } else { const dia=r.getDate(); r.setDate(1); r.setMonth(r.getMonth()+n); const ult=new Date(r.getFullYear(),r.getMonth()+1,0).getDate(); r.setDate(Math.min(dia,ult)); } return r; }
function fmt(d,lg){ return d.toLocaleDateString(lg==="en"?"en-GB":"pt-PT",{day:"numeric",month:"long",year:"numeric"}); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function minus(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
function unidT([un,n]){ if(un==="m") return {t:"m",v:n}; if(n%7===0 && n>=7) return {t:"w",v:n/7}; return {t:"d",v:n}; }
function palavra(t,v,lg){
  const W = lg==="en" ? {m:["month","months"],w:["week","weeks"],d:["day","days"]} : {m:["mês","meses"],w:["semana","semanas"],d:["dia","dias"]};
  return W[t][v===1?0:1];
}
function intervalo(d,lg){
  const A = lg==="en" ? " to " : " a ";
  const a = unidT(d.lo);
  if(!d.hi) return a.v+" "+palavra(a.t,a.v,lg);
  const b = unidT(d.hi);
  if(a.t===b.t) return a.v+A+b.v+" "+palavra(b.t,b.v,lg);
  if(d.lo[0]==="d" && d.hi[0]==="d") return d.lo[1]+A+d.hi[1]+" "+palavra("d",d.hi[1],lg);
  return a.v+" "+palavra(a.t,a.v,lg)+A+b.v+" "+palavra(b.t,b.v,lg);
}

/* ---------- Cálculo ---------- */
function farms(){ return FARMACOS.filter(f=>st.farm[f.id]); }
function semIS(){ const fs=farms(); return fs.length>0 && fs.every(f=>f.semIS); }
function vivasBloqueadas(){ return st.sit==="sob" && !semIS(); }
function preDias(){ return Math.max(28, ...farms().map(f=>f.pre||28)); }
function farmDeterminante(){ const fs=farms().filter(f=>!f.semIS); if(!fs.length) return null; return fs.slice().sort((a,b)=>b.sem-a.sem)[0]; }
function custoFolha(v,s,lg){
  const en = lg==="en";
  const cf = en ? v.custoFolha_en : v.custoFolha;
  const base = cf && cf[s.custo] ? cf[s.custo] : tx(CUSTOS[s.custo],"folha",lg);
  const onde = tx(v,"onde",lg);
  return onde ? base.replace(en?CS_EN:CS_PT, onde) : base;
}
function custoOp(v,s){ return (v.custoOps && v.custoOps[s.custo]) || CUSTOS[s.custo].op; }
function plano(lg){
  const en = lg==="en";
  const base = parse(st.consulta) || hoje;
  const geral = parse(st.dvac);
  const linhas = [];
  VACINAS.forEach(v=>{
    const s = st.sel[v.id]; if(!s.on) return;
    if(v.viva && vivasBloqueadas()) return;
    const vr = v.vars.find(x=>x.id===s.v) || v.vars[0];
    const dProprio = parse(s.d1);
    const comData = !!(dProprio || geral);
    const d1 = dProprio || geral || base;
    vr.doses.forEach((d,i)=>{
      const lo = soma(d1,d.lo), hi = d.hi ? soma(d1,d.hi) : null;
      let quando;
      if(v.sazonal) quando = en ? "This autumn/winter. Repeat every year." : "Neste outono-inverno. Repetir todos os anos.";
      else if(i===0) quando = comData ? (en?"From ":"A partir de ")+fmt(lo,lg) : (tx(vr,"quando0",lg) || (en?"As soon as possible":"Logo que possível"));
      else {
        const ref = vr.ref ? (en ? "after "+vr.ref : "depois da "+vr.ref) : (en ? "after the 1st dose" : "depois da 1.ª dose");
        quando = tx(d,"rel",lg) || ((d.aberto?(en?"At least ":"Pelo menos "):"")+intervalo(d,lg)+" "+ref);
      }
      linhas.push({v, vr, s, dose:doseTxt(d.n,lg), lo, hi, quando, comData, d1, ord:VACINAS.indexOf(v), i, custo:custoFolha(v,s,lg)});
    });
  });
  linhas.sort((a,b)=> (a.v.sazonal?0:1)-(b.v.sazonal?0:1) || a.d1-b.d1 || a.ord-b.ord || a.i-b.i);
  return linhas;
}
function limiteVivas(){ const i=parse(st.inicio); if(!i) return null; return soma(i,["d",-preDias()]); }
function limiteNaoVivas(){ const i=parse(st.inicio); if(!i) return null; return soma(i,["d",-14]); }

/* Outras medidas: {titulo, como, datas:[{d,txt}], reg (sempre em PT)} */
function outras(lg){
  const en = lg==="en", o = [];
  if(st.tb.on){
    const r = TB.find(x=>x.id===st.tb.reg) || TB[0], ini = parse(st.tb.ini), datas = [];
    if(ini){ datas.push({d:ini, txt:en?"Start of tuberculosis preventive treatment":"Início do tratamento preventivo da tuberculose"}); datas.push({d:soma(ini,["m",r.meses]), txt:en?"Planned end of tuberculosis preventive treatment":"Fim previsto do tratamento preventivo da tuberculose"}); }
    ["a1","a2","a3"].forEach(k=>{ const d=parse(st.tb[k]); if(d) datas.push({d, txt:en?"Follow-up blood tests (tuberculosis treatment)":"Análises de controlo (tratamento da tuberculose)"}); });
    o.push({titulo:en?"Preventive treatment for tuberculosis":"Tratamento preventivo da tuberculose", como:tx(r,"leigo",lg), datas, reg:"TB latente: "+r.reg});
  }
  if(st.pj.on){
    const f = PJ.find(x=>x.id===st.pj.f) || PJ[0], ini = parse(st.pj.ini);
    let fim = st.pj.fim.trim();
    if(en && fim===PJ_FIM[0]) fim = PJ_FIM[1];
    if(!en && fim===PJ_FIM[1]) fim = PJ_FIM[0];
    const fimPT = st.pj.fim.trim()===PJ_FIM[1] ? PJ_FIM[0] : st.pj.fim.trim();
    const datas = ini ? [{d:ini, txt:en?"Start of Pneumocystis pneumonia prevention":"Início da prevenção da pneumonia por Pneumocystis"}] : [];
    o.push({titulo:en?"Prevention of Pneumocystis pneumonia":"Prevenção da pneumonia por Pneumocystis", como:tx(f,"leigo",lg)+(fim?". "+fim.replace(/\.+$/,""):""), datas, reg:"Profilaxia de PPJ: "+f.op+(fimPT?" ("+minus(fimPT)+")":"")});
  }
  if(st.ss.on){
    const ini = parse(st.ss.ini), datas = [], rep14 = st.sit==="sob";
    if(st.ss.modo==="trat"){
      if(ini){
        datas.push({d:ini, txt: en ? "Ivermectin"+(rep14?": 1st course":"")+" (once a day, 2 days in a row)" : "Ivermectina"+(rep14?": 1.º ciclo":"")+" (1 toma por dia, 2 dias seguidos)"});
        if(rep14) datas.push({d:soma(ini,["d",14]), txt: en ? "Ivermectin: 2nd course (once a day, 2 days in a row)" : "Ivermectina: 2.º ciclo (1 toma por dia, 2 dias seguidos)"});
      }
      o.push({titulo:en?"Treatment of Strongyloides (intestinal parasite)":"Tratamento de Strongyloides (parasita intestinal)",
              como: en ? "Ivermectin, once a day for 2 days in a row"+(rep14?", repeated 14 days later":"") : "Ivermectina, 1 toma por dia durante 2 dias seguidos"+(rep14?", repetida 14 dias depois":""),
              datas, reg:"Strongyloides: ivermectina 200 µg/kg, 1 toma/dia durante 2 dias"+(rep14?", repetida ao fim de 14 dias (imunocomprometido)":"")});
    } else {
      if(ini) datas.push({d:ini, txt:en?"Strongyloides blood test (sample)":"Análise de Strongyloides (colheita)"});
      o.push({titulo:en?"Screening for Strongyloides (intestinal parasite)":"Rastreio de Strongyloides (parasita intestinal)",
              como: en ? "Blood test requested. If positive, treatment with ivermectin will be offered" : "Análise ao sangue pedida. Se for positiva, será proposto tratamento com ivermectina",
              datas, reg:"Strongyloides: serologia pedida; tratar se positiva"});
    }
  }
  return o;
}

/* ---------- Avisos ao médico (língua da interface) ---------- */
function avisos(linhas){
  const L = st.ui, en = L==="en", a = [], fs = farms(), det = farmDeterminante();
  const vivasSel = VACINAS.filter(v=>v.viva && st.sel[v.id].on);
  if(fs.length>1 && det) a.push(`<div class="info">${en?"Several drugs selected: after discontinuation the longest interval applies, that of":"Vários fármacos assinalados: após suspensão aplica-se o intervalo mais longo, o de"} <b>${esc(minus(tx(det,"op",L)))}</b>: ${esc(tx(det,"pos",L))}.${fs.some(f=>f.lab && f!==det)?(en?" Some selected drugs also require laboratory normalisation.":" Há ainda fármacos que exigem normalização laboratorial."):""}</div>`);
  if(st.sit==="sob"){
    if(semIS()) a.push(`<div class="info">${en?"The selected drug(s) have no relevant immunosuppressive effect for live vaccines, which are therefore not blocked. Case-by-case decision.":"Fármaco(s) assinalado(s) sem efeito imunossupressor relevante para vacinas vivas: não ficam bloqueadas. Decisão caso a caso."}</div>`);
    else a.push(`<div class="alert"><b>${en?"Live vaccines contraindicated":"Vacinas vivas contraindicadas"}</b> ${en?"during moderate to severe immunosuppression.":"sob imunossupressão moderada a grave."}${det?(en?" After discontinuing "+esc(minus(tx(det,"op",L)))+": "+esc(tx(det,"pos",L))+".":" Após suspensão de "+esc(minus(det.op))+": "+esc(det.pos)+"."):(en?" Select the drug(s) to see the interval after discontinuation.":" Assinale o(s) fármaco(s) para ver o intervalo após suspensão.")}</div>`);
  } else if(vivasSel.length){
    const lim = limiteVivas();
    if(!lim) a.push(`<div class="alert">${en?"Live vaccines selected: enter the planned start to calculate the deadline (4 weeks before; 6 weeks for alemtuzumab and ocrelizumab).":"Vacinas vivas assinaladas: indique o início previsto para calcular a data limite (4 semanas antes; 6 semanas para alemtuzumab e ocrelizumab)."}</div>`);
    else{
      const tarde = linhas.filter(l=>l.v.viva && l.lo>lim);
      a.push(`<div class="${tarde.length?"alert":"info"}">${en?"Live vaccines: last dose by":"Vacinas vivas: última dose até"} <b>${fmt(lim,L)}</b> (${preDias()/7} ${en?"weeks before the start":"semanas antes do início"}).${tarde.length?(en?" <b>The selected schedule does not fit this deadline:</b> ":" <b>O esquema assinalado não cabe neste prazo:</b> ")+tarde.map(l=>esc(tx(l.v,"nome",L)+" ("+doseTxt(l.vr.doses[l.i].n,L)+")")).join(", ")+".":""}</div>`);
    }
  }
  if(st.sit==="cand" && vivasSel.length>1) a.push(`<div class="info">${en?"More than one injectable live vaccine: give on the same day or at least 4 weeks apart. If the interval is not respected, repeat the last one 4 or more weeks later.":"Mais do que uma vacina viva injetável: administrar no mesmo dia ou com intervalo mínimo de 4 semanas. Se o intervalo não for respeitado, repetir a última 4 ou mais semanas depois."}</div>`);
  if(st.sit==="cand" && st.sel.vaspr.on) a.push(`<div class="info">${en?"MMR and tuberculin skin test: do the test before the vaccine, or vaccinate on the day the test is read; otherwise wait 4 weeks after MMR (temporary anergy).":"VASPR e teste tuberculínico: fazer o teste antes da vacina, ou vacinar no dia da leitura; caso contrário, aguardar 4 semanas após a VASPR (anergia temporária)."}</div>`);
  $("avisos").innerHTML = a.join("");
}

/* ---------- Folha do utente (língua da folha) ---------- */
function grupos(linhas){ const g=[]; linhas.forEach(l=>{ const x=g[g.length-1]; if(x && x.v===l.v) x.ls.push(l); else g.push({v:l.v, ls:[l]}); }); return g; }
function linhaTemporal(linhas, outs, lg){
  const en = lg==="en", ev = [];
  linhas.forEach(l=>{ if(l.comData && !l.v.sazonal) ev.push({d:l.lo, quando: l.hi ? (en?"Between ":"Entre ")+fmt(l.lo,lg)+(en?" and ":" e ")+fmt(l.hi,lg) : fmt(l.lo,lg), txt:tx(l.v,"nome",lg)+" ("+l.dose+")"}); });
  outs.forEach(o=>o.datas.forEach(x=>ev.push({d:x.d, quando:fmt(x.d,lg), txt:x.txt})));
  const i = parse(st.inicio); if(i && st.sit==="cand" && ev.length) ev.push({d:i, quando:fmt(i,lg), txt:en?"Planned start of immunosuppressive/immunomodulatory treatment":"Início previsto do tratamento imunossupressor/imunomodulador"});
  ev.sort((a,b)=>a.d-b.d);
  return ev;
}
function folhaHTML(lg){
  const en = lg==="en";
  const linhas = plano(lg);
  const base = parse(st.consulta) || hoje;
  const temViva = linhas.some(l=>l.v.viva);
  const limV = limiteVivas(), limN = limiteNaoVivas();
  const extras = [...new Set(linhas.filter(l=>l.v.extra).map(l=>tx(l.v,"extra",lg)))];
  const outs = outras(lg), det = farmDeterminante();
  let h = `<div class="sheet" lang="${en?"en":"pt-PT"}"><h1>${en?"Your vaccination plan":"O seu plano de vacinação"}</h1>
  <p class="sub">${en?"Infection Risk Assessment Clinic (Consulta de Avaliação de Risco Infecioso, CARI)":"Consulta de Avaliação de Risco Infecioso (CARI)"}</p>
  <div class="id"><span>${en?"Name":"Nome"}: ${st.nome.trim()?`<b>${esc(st.nome.trim())}</b>`:'<span class="blank"></span>'}</span><span>${en?"Date of consultation":"Data da consulta"}: <b>${fmt(base,lg)}</b></span></div>
  <p>${st.sit==="sob" ? (en?"You are on a treatment that lowers your body's defences.":"Está a fazer um tratamento que diminui as defesas do organismo.") : (en?"You are about to start a treatment that lowers your body's defences.":"Vai iniciar um tratamento que diminui as defesas do organismo.")} ${en?"The vaccines below help protect you against infections. Tick each one when you have had it.":"As vacinas abaixo ajudam a protegê-lo de infeções. Marque cada uma quando a fizer."}</p>`;
  if(!linhas.length) h += `<p class="empty">${en?"No vaccines selected yet.":"Ainda não há vacinas assinaladas."}</p>`;
  else{
    h += `<table><thead><tr><th>${en?"Vaccine":"Vacina"}</th><th>${en?"Dose":"Dose"}</th><th>${en?"When":"Quando"}</th><th>${en?"Where and cost":"Onde e custo"}</th><th>${en?"Given on":"Feita em"}</th></tr></thead>`;
    grupos(linhas).forEach((g,gi)=>{
      h += `<tbody class="g${gi%2?" alt":""}">`;
      g.ls.forEach((l,i)=>{
        h += `<tr>${i===0?`<td class="vn" rowspan="${g.ls.length}"><b>${esc(tx(g.v,"nome",lg))}</b><small>${en?"Protects against":"Protege contra"} ${esc(tx(g.v,"leigo",lg))}</small></td>`:""}<td class="ds">${esc(l.dose)}</td><td>${esc(l.quando)}</td>${i===0?`<td rowspan="${g.ls.length}">${esc(l.custo)}</td>`:""}<td class="done"><span class="box"></span>__ /__ /____</td></tr>`;
      });
      h += `</tbody>`;
    });
    h += `</table>`;
  }
  const ev = linhaTemporal(linhas, outs, lg);
  if(ev.length) h += `<h2>${en?"Planned schedule":"Calendário previsto"}</h2><ul class="tl">${ev.map(e=>`<li><b>${esc(e.quando)}</b> ${esc(e.txt)}</li>`).join("")}</ul>`;
  if(outs.length) h += `<h2>${en?"Other preventive treatments":"Outros tratamentos preventivos"}</h2><table><thead><tr><th>${en?"What":"O quê"}</th><th>${en?"How":"Como"}</th></tr></thead><tbody>${outs.map(o=>`<tr><td class="vn"><b>${esc(o.titulo)}</b></td><td>${esc(o.como)}.</td></tr>`).join("")}</tbody></table>`;
  if(temViva){
    h += en
      ? `<div class="note warn"><b>Note on the live vaccines in this plan.</b> They can only be given before starting immunosuppressive/immunomodulatory treatment${limV?`: the last dose must be given by <b>${fmt(limV,lg)}</b>, provided the planned start date of that treatment does not change`:""}. If the start date is brought forward, contact the clinic team. Once that treatment has started, do not have them without talking to your doctor.</div>`
      : `<div class="note warn"><b>Atenção às vacinas vivas deste plano.</b> Só podem ser feitas antes de iniciar o tratamento imunossupressor/imunomodulador${limV?`: a última dose tem de ser dada até <b>${fmt(limV,lg)}</b>, desde que se mantenha a data prevista de início do tratamento imunossupressor/imunomodulador`:""}. Se essa data for antecipada, fale com a equipa da consulta. Depois de iniciar esse tratamento, não as faça sem falar com o seu médico.</div>`;
  }
  if(limN && st.sit==="cand" && linhas.some(l=>!l.v.viva)){
    h += en
      ? `<div class="note">The other vaccines work best if given by <b>${fmt(limN,lg)}</b> (2 weeks before starting immunosuppressive/immunomodulatory treatment). If this is not possible, have them anyway.</div>`
      : `<div class="note">As restantes vacinas funcionam melhor se forem feitas até <b>${fmt(limN,lg)}</b> (2 semanas antes de iniciar o tratamento imunossupressor/imunomodulador). Se não conseguir, faça-as na mesma.</div>`;
  }
  if(!semIS()){
    h += en
      ? `<div class="note"><b>Live vaccines to avoid during immunosuppressive/immunomodulatory treatment</b>, unless your doctor advises otherwise:<ul><li>measles, mumps and rubella (MMR);</li><li>chickenpox (varicella);</li><li>yellow fever;</li><li>dengue;</li><li>nasal spray flu vaccine (the injectable flu vaccine can be given);</li><li>typhoid vaccine taken by mouth as capsules (the injectable vaccine can be given).</li></ul>${det?`<p style="margin:8px 0 0">If the immunosuppressive/immunomodulatory treatment is stopped, these vaccines can only be given again after a safety interval and on medical advice. Safety interval: ${esc(tx(det,"pos",lg))}.</p>`:""}</div>`
      : `<div class="note"><b>Vacinas vivas a evitar durante o tratamento imunossupressor/imunomodulador</b>, salvo indicação do seu médico:<ul><li>sarampo, papeira e rubéola (VASPR);</li><li>varicela;</li><li>febre amarela;</li><li>dengue;</li><li>vacina da gripe em spray nasal (a vacina da gripe injetável pode ser feita);</li><li>vacina da febre tifoide em cápsulas, tomada pela boca (a vacina injetável pode ser feita).</li></ul>${det?`<p style="margin:8px 0 0">Se o tratamento imunossupressor/imunomodulador for suspenso, estas vacinas só podem voltar a ser feitas depois de um intervalo de segurança e com indicação médica. Intervalo de segurança: ${esc(det.pos)}.</p>`:""}</div>`;
  }
  const nVac = new Set(linhas.map(l=>l.v.id)).size;
  if(nVac>1 || temViva){
    h += en
      ? `<div class="note"><b>Several vaccines on the same day.</b> ${nVac>1?"Vaccines can be given on the same day, in different parts of the body, or at any interval between them.":""}${temViva?" The exception is live vaccines (measles, chickenpox, yellow fever, dengue): two of these are given on the same day or, if that is not possible, at least 4 weeks apart.":""}</div>`
      : `<div class="note"><b>Várias vacinas no mesmo dia.</b> ${nVac>1?"As vacinas podem ser dadas no mesmo dia, em locais diferentes do corpo, ou com qualquer intervalo entre elas.":""}${temViva?" A exceção são as vacinas vivas (sarampo, varicela, febre amarela, dengue): duas destas vacinas fazem-se no mesmo dia ou, se não for possível, com pelo menos 4 semanas de intervalo.":""}</div>`;
  }
  if(st.viajante) h += en
    ? `<div class="note"><b>Travel.</b> If you plan to travel or return to your country for a long period, book a travel clinic appointment (Consulta do Viajante) 4 to 8 weeks before departure and bring this sheet.</div>`
    : `<div class="note"><b>Viagens.</b> Se planeia viajar ou regressar ao seu país por um período longo, marque uma Consulta do Viajante 4 a 8 semanas antes da partida e leve esta folha.</div>`;
  if(extras.length || st.notas.trim()){
    h += `<div class="note"><b>${en?"Notes":"Notas"}</b><ul>${extras.map(e=>`<li>${esc(e)}</li>`).join("")}${st.notas.trim()?st.notas.trim().split(/\n+/).map(n=>`<li>${esc(n)}</li>`).join(""):""}</ul></div>`;
  }
  h += en
    ? `<div class="end">Bring this sheet and your vaccination record when you go for vaccination. If you have a fever on the day, postpone the vaccine and let the team know. If in doubt, contact the clinic team.<br>CARI · plan issued on ${fmt(base,lg)} · v${VERSAO} · based on Portuguese national recommendations (DGS)<br>${UI.footAut[1]}</div></div>`
    : `<div class="end">Leve esta folha e o boletim de vacinas quando for vacinar-se. Se tiver febre no dia marcado, adie a vacina e avise. Em caso de dúvida, fale com a equipa da consulta.<br>CARI · plano emitido a ${fmt(base,lg)} · v${VERSAO}<br>${UI.footAut[0]}</div></div>`;
  return h;
}
function folhaTexto(lg){
  const en = lg==="en", linhas = plano(lg);
  const base = parse(st.consulta) || hoje;
  let t = (en?"VACCINATION PLAN (CARI)\nDate of consultation: ":"PLANO DE VACINAÇÃO (CARI)\nData da consulta: ")+fmt(base,lg)+"\n\n";
  linhas.forEach(l=>{ t += "[ ] "+tx(l.v,"nome",lg)+" ("+l.dose+"): "+l.quando+". "+l.custo+"\n"; });
  outras(lg).forEach(o=>{ t += "\n"+o.titulo+": "+o.como+"."+(o.datas.length?" "+o.datas.map(x=>x.txt+": "+fmt(x.d,lg)).join("; ")+".":"")+"\n"; });
  const limV = limiteVivas();
  if(linhas.some(l=>l.v.viva) && limV) t += en ? "\nLive vaccines: last dose by "+fmt(limV,lg)+", provided the planned start date of treatment does not change.\n" : "\nVacinas vivas: última dose até "+fmt(limV,lg)+", desde que se mantenha a data prevista de início do tratamento.\n";
  if(st.viajante) t += en ? "\nTravel: book a travel clinic appointment 4 to 8 weeks before departure.\n" : "\nViagens: marcar Consulta do Viajante 4 a 8 semanas antes da partida.\n";
  if(st.notas.trim()) t += (en?"\nNotes: ":"\nNotas: ")+st.notas.trim()+"\n";
  return t;
}

/* ---------- Texto para o centro de saúde e registo: sempre em português ---------- */
function quemTxt(){
  const det = st.condDet.trim(), fs = farms();
  const quem = st.cond==="dii" ? "Utente com doença inflamatória imunomediada"+(det?" ("+det+")":"")
             : st.cond==="ctx" ? "Utente candidato a transplante"+(det?" "+det:"")
             : st.cond==="tx"  ? "Utente transplantado"+(det?" ("+det+")":"")
             : st.cond==="out" && det ? "Utente com "+det : "Utente";
  return quem+(quem==="Utente"?" ":", ")+(st.sit==="sob"?"sob":"com indicação para")+" terapêutica imunossupressora/imunomoduladora"+(fs.length?" ("+fs.map(f=>minus(f.op)).join(" + ")+")":"");
}
function selecionadas(){ return VACINAS.filter(v=>st.sel[v.id].on && !(v.viva && vivasBloqueadas())); }
function vivasFrases(){
  const fs = farms().filter(f=>!f.semIS), limV = limiteVivas(), r = [];
  if(semIS()) r.push("Terapêutica atual sem contraindicação formal para vacinas vivas (imunomodulador não imunossupressor); decisão caso a caso.");
  else if(st.sit==="sob") r.push("Vacinas vivas contraindicadas enquanto mantiver a imunossupressão ("+VIVAS_TXT+").");
  else r.push("Vacinas vivas: podem ser administradas "+(limV?"até "+fmt(limV,"pt")+" ("+(preDias()/7)+" semanas antes do início previsto, desde que se mantenha essa data)":"até 4 semanas antes do início da imunossupressão")+"; ficam contraindicadas depois ("+VIVAS_TXT+").");
  if(fs.length) r.push("Se a terapêutica for suspensa, intervalo mínimo até vacina viva: "+fs.map(f=>minus(f.op)+": "+f.pos).join("; ")+(fs.length>1?". Aplica-se o intervalo mais longo":"")+".");
  return r;
}
function cartaTexto(){
  const base = parse(st.consulta) || hoje, sels = selecionadas();
  let t = "À equipa de enfermagem / vacinação do Centro de Saúde,\n\n"+quemTxt()+", avaliado em Consulta de Avaliação de Risco Infecioso (CARI) a "+fmt(base,"pt")+".\n\nSolicita-se a administração das seguintes vacinas:\n";
  if(!sels.length) t += "(sem vacinas assinaladas)\n";
  sels.forEach(v=>{ const s=st.sel[v.id]; const vr=v.vars.find(x=>x.id===s.v)||v.vars[0]; t += "- "+vr.carta.charAt(0).toUpperCase()+vr.carta.slice(1)+" ["+minus(custoOp(v,s))+"].\n"; });
  t += "\nInformação adicional:\n";
  vivasFrases().forEach(f=>{ t += "- "+f+"\n"; });
  if(sels.length>1 || sels.some(v=>v.viva)){
    t += "- Coadministração: as vacinas inativadas podem ser administradas no mesmo dia ou com qualquer intervalo, entre si e com vacinas vivas, em locais anatómicos diferentes (ou a pelo menos 2,5 cm no mesmo membro)";
    if(sels.some(v=>v.viva)) t += "; as vacinas vivas injetáveis devem ser administradas no mesmo dia ou com intervalo mínimo de 4 semanas entre si";
    t += " (Livro Azul da Imunização, DGS, cap. 10 e cap. 37, secção 4.4.3).\n";
  }
  if(st.folha==="en") t += "- A folha entregue ao utente foi emitida em inglês.\n";
  t += "\nO utente leva consigo a folha com o plano, onde pode ser registada a data de cada administração.\n\nCom os melhores cumprimentos,";
  return t;
}
function registoTexto(){
  const base = parse(st.consulta) || hoje, sels = selecionadas(), outs = outras("pt");
  let t = "CARI, "+fmt(base,"pt")+". "+quemTxt()+".\n";
  const i = parse(st.inicio); if(i && st.sit==="cand") t += "Início previsto da imunossupressão: "+fmt(i,"pt")+".\n";
  t += "Vacinas recomendadas: "+(sels.length ? sels.map(v=>{ const s=st.sel[v.id]; const vr=v.vars.find(x=>x.id===s.v)||v.vars[0]; return v.nome+" ("+vr.op+")"; }).join("; ") : "nenhuma assinalada")+".\n";
  vivasFrases().forEach(f=>{ t += f+"\n"; });
  outs.forEach(o=>{ t += o.reg+(o.datas.length?". "+o.datas.map(x=>x.txt+": "+fmt(x.d,"pt")).join("; "):"")+".\n"; });
  if(st.viajante) t += "Recomendada Consulta do Viajante.\n";
  if(st.folha==="en") t += "Folha do utente entregue em inglês.\n";
  if(st.notas.trim()) t += "Notas: "+st.notas.trim()+"\n";
  return t;
}

/* ---------- Render ---------- */
let ultimas = [];
function render(){
  const L = st.ui, bloq = vivasBloqueadas();
  VACINAS.forEach(v=>{
    const el = $("vac-"+v.id), cb = $("on-"+v.id);
    const bloqueada = !!v.viva && bloq;
    cb.disabled = bloqueada;
    el.classList.toggle("off", bloqueada);
    el.classList.toggle("on", st.sel[v.id].on && !bloqueada);
  });
  $("dInicio").disabled = st.sit==="sob";
  const nf = farms().length;
  $("sumFarm").textContent = (L==="en"?"Drugs / classes (you can select several)":"Fármacos / classes (pode escolher vários)")+(nf?(L==="en"?": "+nf+" selected":": "+nf+" assinalado"+(nf>1?"s":"")):"");
  const r = TB.find(x=>x.id===st.tb.reg), ti = parse(st.tb.ini);
  $("tbFim").textContent = ti ? (L==="en"?"Planned end: ":"Fim previsto: ")+fmt(soma(ti,["m",r.meses]),L)+"." : (L==="en"?"Enter the start date to calculate the planned end.":"Indique a data de início para calcular o fim previsto.");
  avisos(plano(L));
  ultimas = plano(st.folha);
  $("folha").innerHTML = folhaHTML(st.folha);
  $("carta").textContent = cartaTexto();
  $("registo").textContent = registoTexto();
}
function muda(e){
  const t = e.target; if(!t || !t.dataset) return;
  const val = t.type==="checkbox" ? t.checked : t.value;
  if(t.dataset.v) st.sel[t.dataset.v][t.dataset.k] = val;
  else if(t.dataset.f) st.farm[t.dataset.f] = val;
  else if(t.dataset.s) st[t.dataset.s][t.dataset.k] = val;
  else if(t.id==="dConsulta") st.consulta=val;
  else if(t.id==="nome") st.nome=val;
  else if(t.id==="dInicio") st.inicio=val;
  else if(t.id==="dVac") st.dvac=val;
  else if(t.id==="notas") st.notas=val;
  else if(t.id==="cond") st.cond=val;
  else if(t.id==="condDet") st.condDet=val;
  else if(t.id==="viajante") st.viajante=val;
  else if(t.id==="folhaLang") st.folha=val;
  else if(t.name==="sit") st.sit=val;
  else return;
  render();
}
document.addEventListener("input", muda);
document.addEventListener("change", muda);

function mudaLingua(lg){
  if(st.ui===lg) return;
  st.ui = lg; st.folha = lg;
  const outro = PJ_FIM[lg==="en"?0:1];
  if(st.pj.fim===outro){ st.pj.fim = PJ_FIM[lg==="en"?1:0]; $("pjFim").value = st.pj.fim; }
  try{ history.replaceState(null, "", lg==="en" ? "#en" : location.pathname + location.search); }catch(_){}
  montaForm(); render(); diz("");
}
$("uiPT").addEventListener("click", ()=>mudaLingua("pt"));
$("uiEN").addEventListener("click", ()=>mudaLingua("en"));

function diz(m){ $("status").textContent = m; }
function dizL(pt,en){ diz(st.ui==="en"?en:pt); }
async function copia(txt, okPT, okEN){
  try{ await navigator.clipboard.writeText(txt); dizL(okPT, okEN); }
  catch(_){ dizL("Não foi possível copiar. Selecione o texto e copie manualmente.","Could not copy. Select the text and copy it manually."); }
}
$("btnCopiaFolha").addEventListener("click", ()=>copia(folhaTexto(st.folha),"Folha copiada como texto.","Sheet copied as text."));
$("btnCopiaCarta").addEventListener("click", ()=>copia(cartaTexto(),"Texto para o centro de saúde copiado.","Text for the health centre copied."));
$("btnCopiaReg").addEventListener("click", ()=>copia(registoTexto(),"Resumo para registo copiado.","Record summary copied."));
function temConteudo(){ return ultimas.length>0 || outras(st.folha).length>0; }

function documentoImpressao(){
  const css = [...document.querySelectorAll("style")].map(s=>s.textContent).join("\n").split("/* Folha do utente")[1] || "";
  return `<!DOCTYPE html><html lang="${st.folha==="en"?"en":"pt-PT"}"><head><meta charset="utf-8"><title>${st.folha==="en"?"Vaccination plan":"Plano de vacinação"}</title><style>body{margin:0;background:#fff}/* ${css}
.sheet{border:0;box-shadow:none;max-width:none;min-width:0;padding:0}@media screen{.sheet{max-width:794px;margin:24px auto;padding:0 16px}}</style></head><body>${folhaHTML(st.folha)}<script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)})<\/script></body></html>`;
}
let downloads = null;
/* Fora do claude.ai (GitHub Pages ou ficheiro local) o browser imprime diretamente. */
function ativaImpressao(){ $("btnImprimir").hidden = false; }
$("btnImprimir").addEventListener("click", ()=>{
  if(!temConteudo()){ dizL("Assinale pelo menos uma vacina ou medida.","Select at least one vaccine or measure."); return; }
  diz("");
  window.print();
});
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{ if(d){ downloads=d; $("btnFolha").hidden=false; } else ativaImpressao(); }).catch(ativaImpressao);
} else {
  ativaImpressao();
}
$("btnFolha").addEventListener("click", async ()=>{
  if(!downloads) return;
  if(!temConteudo()){ dizL("Assinale pelo menos uma vacina ou medida.","Select at least one vaccine or measure."); return; }
  try{
    await downloads.save({filename:(st.folha==="en"?"vaccination-plan-":"plano-vacinacao-")+st.consulta+".html", data:documentoImpressao()});
    dizL("Folha descarregada. Abra o ficheiro: a janela de impressão abre sozinha.","Sheet downloaded. Open the file: the print dialog opens automatically.");
  }catch(err){
    const c = err && err.code;
    if(c==="declined") dizL("Descarga cancelada.","Download cancelled.");
    else if(c==="rate_limited") dizL("Aguarde um momento e tente de novo.","Wait a moment and try again.");
    else dizL("Não foi possível descarregar nesta vista. Use Copiar folha como texto.","Download is not available in this view. Use Copy sheet as text.");
  }
});

/* Início: #en abre a versão inglesa */
if(location.hash === "#en"){ st.ui = "en"; st.folha = "en"; st.pj.fim = PJ_FIM[1]; }
$("dConsulta").value = st.consulta;
$("pjFim").value = st.pj.fim;
montaForm();
render();
</script>
</body>
</html>
